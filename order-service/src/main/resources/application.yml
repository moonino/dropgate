spring:
  application:
    name: order-service
  datasource:
    url: ${DROPGATE_DB_URL}
    username: order_user
    password: ${DROPGATE_DB_ORDER_PASSWORD}
  flyway:
    schemas: orders
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${DROPGATE_REDIS_HOST}
      port: ${DROPGATE_REDIS_PORT}
      timeout: 200ms
      connect-timeout: 1s

server:
  port: 8082

dropgate:
  order:
    purchase-path: ${DROPGATE_PURCHASE_PATH:redis}
    queue:
      enabled: ${DROPGATE_QUEUE_ENABLED:false}
  auth:
    jwks-uri: ${DROPGATE_AUTH_JWKS_URI}
