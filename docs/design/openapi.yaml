openapi: 3.1.0
info:
  title: dropgate API
  version: 1.0.0
  description: 한정판 드롭 플랫폼. 서비스 셋(auth, order, notification)과 배치의 외부 계약. 모든 시각은 ISO 8601 UTC.
servers:
  - url: https://dropgate.example.com
tags:
  - { name: auth, description: "카카오 로그인, 토큰, JWKS" }
  - { name: drops, description: 드롭 등록과 조회 }
  - { name: queue, description: 접속 대기열과 입장 }
  - { name: orders, description: "구매, 취소, 내 주문" }
  - { name: notifications, description: 알림 피드 }
  - { name: batch, description: 결산과 대조 잡. 클러스터 안에서만 호출 }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: SOLD_OUT }
        message: { type: string, example: 재고가 모두 소진됐습니다 }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900 }
        tokenType: { type: string, example: Bearer }
    User:
      type: object
      required: [id, nickname, role]
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
    Jwks:
      type: object
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty: { type: string, example: RSA }
              kid: { type: string }
              use: { type: string, example: sig }
              alg: { type: string, example: RS256 }
              n: { type: string }
              e: { type: string }
    CreateDropRequest:
      type: object
      required: [name, totalQuantity, openAt, closeAt]
      properties:
        name: { type: string, maxLength: 100 }
        totalQuantity: { type: integer, minimum: 1 }
        openAt: { type: string, format: date-time }
        closeAt: { type: string, format: date-time }
        admissionRatePerSec: { type: integer, minimum: 1, maximum: 10000, default: 50 }
    Drop:
      type: object
      required: [id, name, totalQuantity, openAt, closeAt, status, admissionRatePerSec]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        totalQuantity: { type: integer }
        openAt: { type: string, format: date-time }
        closeAt: { type: string, format: date-time }
        status: { type: string, enum: [SCHEDULED, OPEN, SOLD_OUT, CLOSED] }
        admissionRatePerSec: { type: integer }
        remainingQuantity:
          type: [integer, "null"]
          description: Redis 재고. Redis를 읽을 수 없으면 null
    DropPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Drop' } }
        nextCursor: { type: [string, "null"] }
    QueueEnterResponse:
      type: object
      required: [state, position, estimatedWaitSec]
      properties:
        state: { type: string, enum: [WAITING] }
        position: { type: integer, description: "0부터, 내 앞 사람 수" }
        estimatedWaitSec: { type: integer }
    QueueStatus:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [WAITING, ADMITTED, NOT_IN_QUEUE] }
        position: { type: [integer, "null"] }
        estimatedWaitSec: { type: [integer, "null"] }
        admittedUntil: { type: [string, "null"], format: date-time }
    Order:
      type: object
      required: [id, dropId, dropName, quantity, status, confirmedAt]
      properties:
        id: { type: string, format: uuid }
        dropId: { type: string, format: uuid }
        dropName: { type: string }
        quantity: { type: integer, example: 1 }
        status: { type: string, enum: [CONFIRMED, CANCELED] }
        confirmedAt: { type: string, format: date-time }
        canceledAt: { type: [string, "null"], format: date-time }
    OrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Order' } }
        nextCursor: { type: [string, "null"] }
    Notification:
      type: object
      required: [id, type, dropId, dropName, orderId, message, read, createdAt]
      properties:
        id: { type: string, description: sk 값 }
        type: { type: string, enum: [ORDER_CONFIRMED, ORDER_CANCELED] }
        dropId: { type: string, format: uuid }
        dropName: { type: string }
        orderId: { type: string, format: uuid }
        message: { type: string }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        nextCursor: { type: [string, "null"] }
    JobAccepted:
      type: object
      required: [executionId, jobName, status]
      properties:
        executionId: { type: integer }
        jobName: { type: string }
        status: { type: string, example: STARTING }
    JobStatus:
      type: object
      required: [executionId, jobName, status, startTime]
      properties:
        executionId: { type: integer }
        jobName: { type: string }
        status: { type: string, enum: [STARTING, STARTED, COMPLETED, FAILED, STOPPED] }
        exitCode: { type: [string, "null"] }
        startTime: { type: [string, "null"], format: date-time, description: STARTING이면 null }
        endTime: { type: [string, "null"], format: date-time }
        steps:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string }
              readCount: { type: integer }
              writeCount: { type: integer }
              commitCount: { type: integer }
  responses:
    BadRequest:
      description: 요청 검증 실패. code VALIDATION_FAILED, errors에 필드별 메시지
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: 토큰 없음, 만료, 서명 불일치, 무효화됨. code UNAUTHENTICATED
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: 권한 없음 또는 입장 전. code FORBIDDEN 또는 NOT_ADMITTED
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: code DROP_NOT_FOUND 또는 ORDER_NOT_FOUND
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unavailable:
      description: "의존 저장소 불가. Retry-After 2. code는 AUTH_UNAVAILABLE(모든 Bearer 엔드포인트의 토큰 무효화 확인, 로그인 콜백, 재발급, 로그아웃), STOCK_UNAVAILABLE(대기열, 구매), ORDER_PERSIST_FAILED(구매), NOTIFICATION_UNAVAILABLE(피드)"
      headers:
        Retry-After: { schema: { type: integer }, description: 초 }
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
paths:
  /auth/login/kakao:
    get:
      tags: [auth]
      summary: 카카오 인가 페이지로 리다이렉트
      security: []
      responses:
        '302': { description: Location 카카오 인가 URL }
  /auth/callback/kakao:
    get:
      tags: [auth]
      summary: 카카오 콜백. 사용자 저장 뒤 토큰 발급
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 토큰 쌍, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { description: 카카오 응답 실패. code KAKAO_UNAVAILABLE, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/token/refresh:
    post:
      tags: [auth]
      summary: 리프레시 토큰으로 새 토큰 쌍 발급. 옛 리프레시는 폐기(회전)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties: { refreshToken: { type: string } }
      responses:
        '200': { description: 새 토큰 쌍, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 액세스 토큰 무효화와 리프레시 전부 폐기
      security: [ { bearer: [] } ]
      responses:
        '204': { description: 완료 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/me:
    get:
      tags: [auth]
      summary: 내 정보
      security: [ { bearer: [] } ]
      responses:
        '200': { description: 사용자, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /.well-known/jwks.json:
    get:
      tags: [auth]
      summary: 공개키 집합. 다른 서비스가 10분 캐시
      security: []
      responses:
        '200': { description: JWKS, content: { application/json: { schema: { $ref: '#/components/schemas/Jwks' } } } }
  /api/admin/drops:
    post:
      tags: [drops]
      summary: 드롭 등록(ADMIN)
      security: [ { bearer: [] } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateDropRequest' } } }
      responses:
        '201': { description: 등록됨, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Drop' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/drops:
    get:
      tags: [drops]
      summary: 드롭 목록(SCHEDULED, OPEN, SOLD_OUT), openAt 순, 커서 페이징
      security: []
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: 목록, content: { application/json: { schema: { $ref: '#/components/schemas/DropPage' } } } }
  /api/drops/{dropId}:
    get:
      tags: [drops]
      summary: 드롭 단건. remainingQuantity는 Redis에서, 못 읽으면 null
      security: []
      parameters:
        - { name: dropId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 드롭, content: { application/json: { schema: { $ref: '#/components/schemas/Drop' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/drops/{dropId}/queue:
    post:
      tags: [queue]
      summary: 대기열 진입. 이미 있으면 기존 순번 반환
      security: [ { bearer: [] } ]
      parameters:
        - { name: dropId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: 대기 중, content: { application/json: { schema: { $ref: '#/components/schemas/QueueEnterResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "code DROP_NOT_OPEN, SOLD_OUT, ALREADY_PURCHASED", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/drops/{dropId}/queue/me:
    get:
      tags: [queue]
      summary: 내 순번과 입장 상태. 클라이언트는 2초 간격 폴링, 409를 받으면 폴링을 끝낸다
      security: [ { bearer: [] } ]
      parameters:
        - { name: dropId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 상태, content: { application/json: { schema: { $ref: '#/components/schemas/QueueStatus' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "드롭이 OPEN이 아니다. code DROP_NOT_OPEN, SOLD_OUT", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
    delete:
      tags: [queue]
      summary: 대기열 포기
      security: [ { bearer: [] } ]
      parameters:
        - { name: dropId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 완료(대기열에 없어도 204) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/drops/{dropId}/orders:
    post:
      tags: [orders]
      summary: 구매. 입장 상태여야 하고 1인 1개
      security: [ { bearer: [] } ]
      parameters:
        - { name: dropId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '201': { description: 주문 확정, headers: { Location: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: code NOT_ADMITTED, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "code DROP_NOT_OPEN, SOLD_OUT, ALREADY_PURCHASED. Lua 반환 순서", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/orders/me:
    get:
      tags: [orders]
      summary: 내 주문, 최신순 커서 페이징
      security: [ { bearer: [] } ]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200': { description: 목록, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/orders/{orderId}/cancel:
    post:
      tags: [orders]
      summary: 주문 취소. 본인 주문, 드롭 마감 전, CONFIRMED만
      security: [ { bearer: [] } ]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: 취소됨, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "code ORDER_ALREADY_CANCELED, DROP_CLOSED", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '503': { $ref: '#/components/responses/Unavailable' }
  /api/notifications/me:
    get:
      tags: [notifications]
      summary: 내 알림 피드, 최신순 커서 페이징
      security: [ { bearer: [] } ]
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 50 } }
      responses:
        '200': { description: 목록, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /batch/jobs/daily-settlement:
    post:
      tags: [batch]
      summary: 일별 결산 실행. 클러스터 안에서만 호출. 같은 날짜 재호출은 재시작
      security: []
      parameters:
        - { name: settlementDate, in: query, required: false, schema: { type: string, format: date }, description: "KST 날짜, 기본 어제" }
      responses:
        '202': { description: 시작됨, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
        '409': { description: 같은 파라미터로 실행 중. code JOB_ALREADY_RUNNING, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
  /batch/jobs/reconciliation:
    post:
      tags: [batch]
      summary: Redis 대 DB 대조 실행. dropId가 없으면 OPEN과 SOLD_OUT 드롭 전부
      security: []
      parameters:
        - { name: dropId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '202': { description: 시작됨, content: { application/json: { schema: { $ref: '#/components/schemas/JobAccepted' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /batch/jobs/{executionId}:
    get:
      tags: [batch]
      summary: 실행 상태
      security: []
      parameters:
        - { name: executionId, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: 상태, content: { application/json: { schema: { $ref: '#/components/schemas/JobStatus' } } } }
        '404': { description: code JOB_EXECUTION_NOT_FOUND, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
