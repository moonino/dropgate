name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktlintCheck test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-reports
          path: |
            **/build/reports/tests/
            **/build/reports/ktlint/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check:api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [auth-service, order-service, notification-service, settlement-batch]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker build --build-arg MODULE=${{ matrix.module }} -t dropgate/${{ matrix.module }}:ci .

  review-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: .github/scripts/extract-review.test.sh
      - run: .github/scripts/review-tools.test.sh
