name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"

jobs:
  review:
    name: review
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: "/code-review --comment ${{ github.event.pull_request.html_url }}"
          claude_args: '--model claude-opus-5-5 --max-turns 40 --allowedTools "Agent,TodoWrite,Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"'

      - name: Post the review
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ steps.claude.outputs.github_token || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          .github/scripts/extract-review.sh "$EXECUTION_FILE" > "${RUNNER_TEMP}/review.md"
          gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/review.md"
